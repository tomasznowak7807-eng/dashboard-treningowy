<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro-Coach AI | Ultimate Performance System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--primary:#0f172a;
--secondary:#3b82f6;
--accent:#ef4444;
--strength:#10b981;
--recovery:#f59e0b;
--bg:#f8fafc;
--dark:#1e293b;
--text:#334155;
}
*{box-sizing:border-box}
body{
margin:0;
padding:20px;
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
}
.container{max-width:1100px;margin:auto}

/* HEADER */
header{
background:linear-gradient(135deg,var(--primary),#1e293b);
color:white;
padding:1.5rem;
border-radius:16px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.btn-reset{
background:rgba(255,255,255,0.1);
color:white;
border:1px solid white;
padding:8px 16px;
border-radius:8px;
cursor:pointer;
font-weight:700;
}

/* STATS */
.sync-dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}
.stat-box{
background:var(--dark);
color:white;
padding:20px;
border-radius:16px;
}
.stat-box small{
font-size:0.7rem;
color:#94a3b8;
text-transform:uppercase;
font-weight:700;
}
.stat-box span{
font-size:1.8rem;
font-weight:800;
}

/* ASSISTANT */
#assistant-box{
background:white;
padding:25px;
border-left:8px solid #cbd5e1;
border-radius:16px;
margin-bottom:20px;
}

/* TRAINING */
.training-card{
background:white;
padding:20px;
border-radius:16px;
border:1px solid #e2e8f0;
margin-bottom:15px;
}

.day-tag{
background:var(--primary);
color:white;
padding:4px 10px;
border-radius:6px;
font-weight:800;
font-size:0.8rem;
}

.bar-chart{
display:flex;
align-items:flex-end;
gap:3px;
height:80px;
background:#f1f5f9;
padding:8px;
border-radius:8px;
margin:15px 0;
}
.bar{flex:1;border-radius:2px}
.z1{background:#94a3b8}
.z2{background:#3b82f6}
.z3{background:#06b6d4}
.z4{background:#f59e0b}
.z5{background:#f97316}
.z6{background:#ef4444}

/* TREND */
.trend-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(400px,1fr));
gap:20px;
margin-top:20px;
}
.chart-card{
background:white;
padding:20px;
border-radius:16px;
border:1px solid #e2e8f0;
}

/* MODAL */
#editModal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.4);
align-items:center;
justify-content:center;
}
.modal-content{
background:white;
padding:25px;
border-radius:16px;
width:350px;
}
.modal-content input,
.modal-content textarea,
.modal-content select{
width:100%;
margin-bottom:10px;
padding:6px;
}

@media(max-width:600px){
.trend-grid{grid-template-columns:1fr}
header{flex-direction:column;gap:10px}
}
</style>
</head>
<body>

<div class="container">

<header>
<div>
<h1 style="margin:0">PRO-COACH AI 2026</h1>
<small id="sync-status">Inicjalizacja...</small>
</div>
<button class="btn-reset" onclick="resetPlan()">RESET</button>
</header>

<div class="sync-dashboard">
<div class="stat-box"><small>Wellness</small><span id="cloud-wellness">--%</span></div>
<div class="stat-box"><small>TSS</small><span id="cloud-tss">---</span></div>
<div class="stat-box"><small>Waga</small><span id="cloud-weight">-- kg</span></div>
<div class="stat-box"><small>W/kg</small><span id="wkg">--</span></div>
</div>

<div id="assistant-box">
<div id="warn-msg" style="font-weight:900;text-transform:uppercase;">Łączenie...</div>
<div id="sugg-msg" style="margin-top:5px;color:#64748b;"></div>
</div>

<div id="ai-panel" class="training-card">
<h3>🤖 AI COACH</h3>
<div id="ai-msg"></div>
</div>

<div id="supp-panel" class="training-card">
<h3>💊 Smart Suplementacja</h3>
<div id="supp-msg"></div>
</div>

<div id="dynamic-plan"></div>

<div class="trend-grid">
<div class="chart-card">
<h3>Trend TSS</h3>
<canvas id="tssChart"></canvas>
</div>
<div class="chart-card">
<h3>Trend W/kg</h3>
<canvas id="wkgChart"></canvas>
</div>
</div>

</div>

<div id="editModal">
<div class="modal-content">
<h3>Edytuj jednostkę</h3>
<input id="editTitle" placeholder="Nazwa">
<textarea id="editDesc" placeholder="Opis"></textarea>
<input type="number" id="editDuration" placeholder="Czas (min)">
<select id="editZone">
<option>Z1</option><option>Z2</option><option>Z3</option>
<option>Z4</option><option>Z5</option><option>Z6</option>
</select>
<button onclick="saveEdit()">Zapisz</button>
<button onclick="closeModal()">Anuluj</button>
</div>
</div>

<script>
const CONFIG={
csvUrl:"https://docs.google.com/spreadsheets/d/e/2PACX-1vRVLylCkxR1sbSnxYdWGCBpgeILRZMa3uTZCz6qPQ47Q5QJsinxI_T2n_KkjxKlbbz6JBadfQLLXxDP/pub?gid=950508224&single=true&output=csv",
cacheKey:"procoach_v5"
};

const initialPlan=[
{day:"Pon",title:"Siła FBW A",desc:"Przysiad, Podciąganie, Core",type:"gym"},
{day:"Wt",title:"Sprinty & Tempo",desc:"Interwały Z6",type:"bike"},
{day:"Śr",title:"Regeneracja",desc:"Mobilność",type:"rest"},
{day:"Czw",title:"Sweet Spot",desc:"Bloki Z3-Z4",type:"bike"},
{day:"Pt",title:"Siła FBW B",desc:"Bułgary, Pompki",type:"gym"},
{day:"Sob",title:"Regeneracja",desc:"Spacer, rolowanie",type:"rest",locked:true},
{day:"Nie",title:"Tlen + Technika",desc:"Kadencja + Single Leg",type:"bike"}
];

let currentPlan=JSON.parse(localStorage.getItem("plan"))||initialPlan;
let editIndex=null;
let tssChart,wkgChart;

function renderPlan(){
const c=document.getElementById("dynamic-plan");
c.innerHTML="";
currentPlan.forEach((t,i)=>{
const card=document.createElement("div");
card.className="training-card";
card.innerHTML=`
<div style="display:flex;justify-content:space-between">
<span class="day-tag">${t.day}</span>
<button onclick="editUnit(${i})">✏</button>
</div>
<h3>${t.title}</h3>
<p>${t.desc}</p>`;
c.appendChild(card);
});
}

function editUnit(i){
if(currentPlan[i].locked){alert("Sobota = regeneracja");return;}
editIndex=i;
document.getElementById("editTitle").value=currentPlan[i].title;
document.getElementById("editDesc").value=currentPlan[i].desc;
document.getElementById("editModal").style.display="flex";
}

function saveEdit(){
currentPlan[editIndex].title=document.getElementById("editTitle").value;
currentPlan[editIndex].desc=document.getElementById("editDesc").value;
localStorage.setItem("plan",JSON.stringify(currentPlan));
closeModal();
renderPlan();
}
function closeModal(){document.getElementById("editModal").style.display="none";}

function initCharts(){
tssChart=new Chart(document.getElementById("tssChart"),{type:"line",data:{labels:[],datasets:[{data:[],borderColor:"#ef4444",fill:false}]},options:{responsive:true}});
wkgChart=new Chart(document.getElementById("wkgChart"),{type:"line",data:{labels:[],datasets:[{data:[],borderColor:"#10b981",fill:false}]},options:{responsive:true}});
}

function updateAI(tss,well){
let msg="Forma stabilna.";
if(well<40)msg="Regeneracja wskazana.";
if(tss>120)msg="Wysokie obciążenie — skróć kolejną jednostkę o 15%.";
document.getElementById("ai-msg").innerText=msg;
}

function updateSupp(well){
let msg="Standard: D3+K2 + Kreatyna 5g.";
if(well<40)msg="Magnez + Omega 3 + 8h snu.";
if(well<70&&well>=40)msg="60g węgli/h przy interwałach.";
document.getElementById("supp-msg").innerText=msg;
}

async function sync(){
try{
const r=await fetch(CONFIG.csvUrl+"&t="+Date.now());
const txt=await r.text();
const rows=txt.split(/\r?\n/).map(l=>l.split(","));
let w=63,f=200,t=0,well=80;
rows.forEach(([p,v])=>{
if(p==="Waga"){w=parseFloat(v);document.getElementById("cloud-weight").innerText=v+"kg";}
if(p==="FTP")f=parseFloat(v);
if(p==="TSS"){t=parseFloat(v);document.getElementById("cloud-tss").innerText=v;}
if(p==="Status_Zmeczenia"){well=parseInt(v);document.getElementById("cloud-wellness").innerText=v+"%";}
});
const ratio=(f/w).toFixed(2);
document.getElementById("wkg").innerText=ratio;
updateAI(t,well);
updateSupp(well);
}catch(e){}
}

window.onload=()=>{initCharts();renderPlan();sync();setInterval(sync,60000);}
</script>

</body>
</html>
