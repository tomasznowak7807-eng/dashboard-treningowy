<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAPTIVE COACH AI v4.0 | Performance Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0f172a; --secondary: #3b82f6; --accent: #ef4444;
            --strength: #10b981; --recovery: #f59e0b; --bg: #f8fafc;
            --dark: #1e293b; --text: #334155;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { margin: 0; padding: 20px; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 1200px; margin: auto; }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, #1e293b 100%);
            color: white; padding: 1.5rem; border-radius: 16px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .drop-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 20px; }
        .drop-zone {
            border: 2px dashed var(--secondary); border-radius: 16px; padding: 20px; 
            text-align: center; background: rgba(59, 130, 246, 0.05); cursor: pointer;
        }

        .dashboard-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px;
        }
        .stat-box { background: var(--dark); color: white; padding: 15px; border-radius: 16px; position: relative; overflow: hidden; }
        .stat-box small { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; display: block; }
        .stat-box span { font-size: 1.6rem; font-weight: 800; }
        .stat-box .trend { position: absolute; right: 10px; bottom: 10px; font-size: 0.7rem; font-weight: bold; }

        .card { background: white; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        
        .input-row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 15px; }
        .input-group { flex: 1; }
        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; color: var(--primary); }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; }
        
        .btn-save { padding: 10px 20px; background: var(--secondary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .grid-main { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0">ADAPTIVE COACH AI <span style="font-size: 0.6em; opacity: 0.6;">v4.0 Professional</span></h1>
            <small>Analiza mocy, pułapu tlenowego i biometrii</small>
        </div>
        <button onclick="resetApp()" style="background:none; border: 1px solid white; color: white; border-radius: 6px; cursor:pointer;">Reset danych</button>
    </header>

    <div class="drop-grid">
        <div id="drop-trainings" class="drop-zone">📥 Wrzuć Treningi (Garmin CSV)</div>
        <div id="drop-vitals" class="drop-zone" style="border-color: var(--strength);">📈 Wrzuć FTP/VO2Max CSV</div>
    </div>

    <div class="card">
        <div class="input-row">
            <div class="input-group">
                <label>Aktualna waga (kg)</label>
                <input type="number" id="user-weight" step="0.1" placeholder="np. 75.5">
            </div>
            <div class="input-group">
                <label>Aktualne FTP (W)</label>
                <input type="number" id="user-ftp" placeholder="np. 280">
            </div>
            <div class="input-group">
                <label>VO2Max</label>
                <input type="number" id="user-vo2" placeholder="np. 52">
            </div>
            <button class="btn-save" onclick="saveVitals()">Zapisz Biometrię</button>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="stat-box"><small>W/kg (Ratio)</small><span id="val-wkg">--</span></div>
        <div class="stat-box"><small>Balance (TSB)</small><span id="val-tsb">--</span></div>
        <div class="stat-box"><small>VO2Max</small><span id="val-vo2max">--</span></div>
        <div class="stat-box"><small>FTP</small><span id="val-ftp-disp">-- W</span></div>
    </div>

    <div class="grid-main">
        <div class="card">
            <h3 style="margin-top:0">📊 Trend Wydolności</h3>
            <canvas id="performanceChart" height="150"></canvas>
        </div>
        <div class="card">
            <h3 style="margin-top:0">🧠 Werdykt AI</h3>
            <div id="ai-box" style="padding: 15px; border-radius: 12px; border-left: 5px solid #ddd;">
                <p id="ai-text">Wgraj dane, aby rozpocząć analizę.</p>
                <div id="training-next" style="font-weight: 800; color: var(--secondary); margin-top: 10px;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let trainingHistory = JSON.parse(localStorage.getItem('acai_history')) || [];
    let userVitals = JSON.parse(localStorage.getItem('acai_vitals')) || { weight: 0, ftp: 0, vo2: 0 };
    let chartObj;

    window.onload = () => {
        document.getElementById('user-weight').value = userVitals.weight;
        document.getElementById('user-ftp').value = userVitals.ftp;
        document.getElementById('user-vo2').value = userVitals.vo2;
        refreshUI();
    };

    function saveVitals() {
        userVitals = {
            weight: parseFloat(document.getElementById('user-weight').value) || 0,
            ftp: parseInt(document.getElementById('user-ftp').value) || 0,
            vo2: parseInt(document.getElementById('user-vo2').value) || 0
        };
        localStorage.setItem('acai_vitals', JSON.stringify(userVitals));
        refreshUI();
    }

    // --- PARSERY ---
    function setupDrop(id, callback) {
        const dz = document.getElementById(id);
        dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.background = "#e0e7ff"; });
        dz.addEventListener('dragleave', () => dz.style.background = "");
        dz.addEventListener('drop', e => {
            e.preventDefault();
            dz.style.background = "";
            const file = e.dataTransfer.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => callback(ev.target.result);
            reader.readAsText(file);
        });
    }

    setupDrop('drop-trainings', (csv) => {
        const lines = csv.split('\n').slice(1);
        trainingHistory = lines.map(l => {
            const c = l.split(l.includes(';') ? ';' : ',');
            return { date: new Date(c[0]), dist: parseFloat(c[3]) || 0, tss: (parseFloat(c[3]) * 6) || 40 };
        }).filter(d => !isNaN(d.date.getTime()));
        localStorage.setItem('acai_history', JSON.stringify(trainingHistory));
        refreshUI();
    });

    setupDrop('drop-vitals', (csv) => {
        // Parser dla pliku FTP/VO2: Format oczekiwany Date,FTP,VO2
        const lines = csv.split('\n').slice(1);
        const lastData = lines[lines.length - 1].split(',');
        userVitals.ftp = parseInt(lastData[1]);
        userVitals.vo2 = parseInt(lastData[2]);
        saveVitals();
    });

    function refreshUI() {
        if (trainingHistory.length === 0) return;

        const now = new Date();
        const atl = trainingHistory.filter(d => (now - d.date) / 86400000 <= 7).reduce((a,b) => a + b.tss, 0) / 7;
        const ctl = trainingHistory.filter(d => (now - d.date) / 86400000 <= 28).reduce((a,b) => a + b.tss, 0) / 28;
        const tsb = ctl - atl;

        document.getElementById('val-tsb').innerText = Math.round(tsb);
        document.getElementById('val-ctl').innerText = Math.round(ctl);
        document.getElementById('val-atl').innerText = Math.round(atl);
        
        document.getElementById('val-ftp-disp').innerText = userVitals.ftp + " W";
        document.getElementById('val-vo2max').innerText = userVitals.vo2;
        
        if (userVitals.weight > 0 && userVitals.ftp > 0) {
            const wkg = (userVitals.ftp / userVitals.weight).toFixed(2);
            document.getElementById('val-wkg').innerText = wkg;
        }

        updateAI(tsb, userVitals);
        updateChart();
    }

    function updateAI(tsb, vitals) {
        const aiBox = document.getElementById('ai-box');
        const text = document.getElementById('ai-text');
        const next = document.getElementById('training-next');

        if (tsb < -20) {
            aiBox.style.borderColor = "var(--accent)";
            text.innerText = "Wykryto wysokie zmęczenie. Twoje VO2Max (" + vitals.vo2 + ") może chwilowo spaść przez brak świeżości.";
            next.innerText = "DZIŚ: Regeneracja (Z1)";
        } else if (tsb > 5) {
            aiBox.style.borderColor = "var(--strength)";
            text.innerText = "Twoja forma jest stabilna. Przy " + (vitals.ftp / vitals.weight).toFixed(1) + " W/kg jesteś gotowy na mocne podjazdy/interwały.";
            next.innerText = "DZIŚ: Test FTP lub Interwały VO2Max";
        } else {
            aiBox.style.borderColor = "var(--secondary)";
            text.innerText = "Balans zachowany. Dobry moment na budowanie bazy tlenowej.";
            next.innerText = "DZIŚ: 90 min Steady State (Z2)";
        }
    }

    function updateChart() {
        const ctx = document.getElementById('performanceChart').getContext('2d');
        if (chartObj) chartObj.destroy();
        
        const last14 = trainingHistory.slice(-14);
        chartObj = new Chart(ctx, {
            type: 'line',
            data: {
                labels: last14.map(d => d.date.toLocaleDateString()),
                datasets: [{
                    label: 'Obciążenie (TSS)',
                    data: last14.map(d => d.tss),
                    borderColor: '#3b82f6',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(59, 130, 246, 0.1)'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    }

    function resetApp() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
