<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAPTIVE COACH AI v5.2 | Ultimate Baseline</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0f172a; --secondary: #3b82f6; --accent: #ef4444;
            --strength: #10b981; --recovery: #f59e0b; --bg: #f8fafc;
            --dark: #1e293b; --text: #334155;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { margin: 0; padding: 20px; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        .container { max-width: 1200px; margin: auto; }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, #1e293b 100%);
            color: white; padding: 1.5rem; border-radius: 16px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: var(--dark); color: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .stat-box small { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 5px; }
        .stat-box span { font-size: 1.8rem; font-weight: 800; }

        .card { background: white; padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        
        #profile-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); display: none; justify-content: center; align-items: center; z-index: 3000;
        }
        .popup-card { background: white; padding: 30px; border-radius: 20px; max-width: 950px; width: 95%; max-height: 90vh; overflow-y: auto; }
        .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        label { display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 4px; color: var(--primary); text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.9rem; }

        .week-planner { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin: 15px 0 25px 0; }
        .day-box { background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; text-align: center; }
        .day-box b { font-size: 0.75rem; display: block; margin-bottom: 5px; color: var(--secondary); text-transform: uppercase; }
        .info-tag { font-size: 0.6rem; color: #64748b; margin-top: 5px; display: block; line-height: 1.3; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 15px; }
        .cal-day { padding: 12px 5px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; text-align: center; font-size: 0.75rem; color: #475569; }
        .cal-today { border: 2px solid var(--secondary); background: #f0f9ff; font-weight: 700; color: var(--primary); box-shadow: 0 4px 6px rgba(59, 130, 246, 0.1); }

        .btn-main { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .btn-main:hover { background: var(--secondary); transform: translateY(-1px); }
        .btn-outline { background: none; border: 1px solid white; color: white; }
        .btn-reset { background: #94a3b8; font-size: 0.8rem; padding: 12px 15px; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        .drop-zone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; background: #f8fafc; font-size: 0.8rem; transition: 0.3s; }
        .drop-zone:hover { border-color: var(--secondary); background: #f0f7ff; }

        .grid-main { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
        .ai-verdict { padding: 20px; background: #f0f9ff; border-radius: 16px; border-left: 8px solid var(--secondary); }

        #ai-chat-btn {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%;
            background: var(--secondary); color: white; display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem; cursor: pointer; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4); z-index: 2000; transition: 0.3s;
        }
        #ai-chat-btn:hover { transform: scale(1.1); }
        #ai-chat-window {
            position: fixed; bottom: 100px; right: 30px; width: 350px; height: 450px;
            background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            display: none; flex-direction: column; border: 1px solid #e2e8f0; z-index: 2000; overflow: hidden;
        }
        .chat-header { background: var(--primary); color: white; padding: 15px; font-weight: 800; display: flex; justify-content: space-between; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #fdfdfd; display: flex; flex-direction: column; gap: 10px; }
        .chat-bubble { padding: 10px 14px; border-radius: 15px; max-width: 85%; font-size: 0.85rem; line-height: 1.4; }
        .bot { background: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; color: var(--primary); }
        .user { background: var(--secondary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-input { padding: 10px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .chat-input input { flex: 1; border: 1px solid #ddd; padding: 10px; border-radius: 10px; outline: none; }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--strength); color: white; padding: 12px 30px; border-radius: 30px; display: none; z-index: 4000; font-weight: 600; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0; color: #94a3b8; font-size: 0.8rem; line-height: 1.5; }

        @media (max-width: 900px) { .grid-main { grid-template-columns: 1fr; } .week-planner { grid-template-columns: repeat(4, 1fr); } #ai-chat-window { width: 90%; right: 5%; bottom: 90px; } }
    </style>
</head>
<body>

<div id="toast" class="toast">Akcja zakończona pomyślnie!</div>

<div id="profile-overlay">
    <div class="popup-card">
        <div class="popup-header">
            <h2 style="margin:0">⚙️ Konfiguracja Elite & Harmonogram</h2>
            <button onclick="document.getElementById('profile-overlay').style.display='none'" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">✕</button>
        </div>

        <h3 style="font-size:0.9rem; color:var(--secondary); margin-bottom:10px;">1. BIOMETRIA I CELE STARTOWE</h3>
        <div class="input-grid">
            <div><label>Wiek</label><input type="number" id="p-age"></div>
            <div><label>Waga (kg)</label><input type="number" id="p-weight" step="0.1"></div>
            <div><label>FTP (W)</label><input type="number" id="p-ftp"></div>
            <div><label>Próg HR (BPM)</label><input type="number" id="p-thr-hr"></div>
            <div><label>Max HR</label><input type="number" id="p-max-hr"></div>
            <div><label>Data Głównych Zawodów</label><input type="date" id="p-race-date"></div>
        </div>

        <h3 style="font-size:0.9rem; color:var(--secondary); margin-top:20px; margin-bottom:10px;">2. BAZOWY PLAN TYGODNIA</h3>
        <div class="week-planner" id="planner-container"></div>

        <h3 style="font
