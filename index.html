<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAI 4.2 | Pro Coach Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0f172a; --secondary: #3b82f6; --accent: #ef4444;
            --strength: #10b981; --recovery: #f59e0b; --bg: #f8fafc;
            --dark: #1e293b; --text: #334155;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { margin: 0; padding: 20px; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 900px; margin: auto; }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, #1e293b 100%);
            color: white; padding: 1.5rem; border-radius: 16px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Overlaye dla ankiet */
        .overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(15, 23, 42, 0.98); z-index: 1000; 
            display: flex; justify-content: center; align-items: center;
        }
        .card-modal {
            background: white; padding: 30px; border-radius: 20px; max-width: 500px; width: 90%;
            max-height: 90vh; overflow-y: auto; color: var(--text); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
        }

        .btn-main {
            background: var(--secondary); color: white; border: none; padding: 12px 20px;
            border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; margin-top: 10px;
        }
        .btn-outline { background: none; border: 1px solid #ddd; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 5px; }

        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; color: var(--primary); }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }

        .sync-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: var(--dark); color: white; padding: 15px; border-radius: 16px; text-align: center; }
        .stat-box small { display: block; font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .stat-box span { font-size: 1.3rem; font-weight: 800; }

        #assistant-box {
            background: white; padding: 20px; border-left: 8px solid #3b82f6; border-radius: 16px;
            margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .training-card {
            background: white; padding: 18px; border-radius: 16px; border: 1px solid #e2e8f0;
            margin-bottom: 12px; cursor: pointer; transition: transform 0.2s;
        }
        .training-card:hover { transform: translateY(-2px); border-color: var(--secondary); }
        .day-tag { background: var(--primary); color: white; padding: 3px 8px; border-radius: 5px; font-size: 0.75rem; font-weight: 700; }
        
        .hidden { display: none !important; }
        .hr-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div id="onboarding-overlay" class="overlay hidden">
    <div class="card-modal">
        <h2 style="margin-top:0">Konfiguracja ACAI</h2>
        
        <label>Dyscyplina:</label>
        <select id="user-sport">
            <option value="run">Bieganie</option>
            <option value="mtb">Kolarstwo MTB</option>
            <option value="road">Kolarstwo Szosowe</option>
            <option value="triathlon">Triathlon</option>
        </select>

        <label>Dni treningowe (budżet):</label>
        <input type="number" id="user-days" min="1" max="7" value="4">

        <div class="hr-grid">
            <div>
                <label>Max HR</label>
                <input type="number" id="user-max-hr" value="190">
            </div>
            <div>
                <label>Threshold</label>
                <input type="number" id="user-lthr" value="170">
            </div>
            <div>
                <label>Rest HR</label>
                <input type="number" id="user-rest-hr" value="55">
            </div>
        </div>

        <label>Stres życiowy:</label>
        <select id="user-life-stress">
            <option value="low">Niski</option>
            <option value="mid" selected>Normalny</option>
            <option value="high">Wysoki</option>
        </select>

        <button class="btn-main" onclick="saveOnboarding()">ZAPISZ I GENERUJ PLAN</button>
    </div>
</div>

<div id="post-workout-overlay" class="overlay hidden">
    <div class="card-modal">
        <h2 style="margin-top:0">Raport po treningu</h2>
        <p id="pw-title" style="font-weight: 700; color: var(--secondary);"></p>
        
        <label>Jak ciężko było? (RPE 1-10)</label>
        <input type="range" id="pw-rpe" min="1" max="10" value="5" oninput="this.nextElementSibling.value = this.value">
        <output>5</output> / 10

        <label style="margin-top:15px">Czy czujesz nietypowy ból?</label>
        <select id="pw-pain">
            <option value="no">Nie, wszystko OK</option>
            <option value="yes_minor">Lekki dyskomfort</option>
            <option value="yes_major">Tak, wyraźny ból</option>
        </select>

        <label>Dodatkowe notatki:</label>
        <textarea id="pw-notes" rows="2" placeholder="Jak się czułeś?"></textarea>

        <button class="btn-main" onclick="savePostWorkout()">WYŚLIJ DO TRENERA AI</button>
        <button class="btn-outline" onclick="closeModals()">ANULUJ</button>
    </div>
</div>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0; font-size: 1.4rem;">ACAI PRO 4.2</h1>
            <small id="sync-status">Ładowanie profilu...</small>
        </div>
        <button onclick="resetAll()" style="background:none; border:1px solid white; color:white; padding:5px 10px; border-radius:5px; cursor:pointer; font-size:0.7rem;">RESET PROFILU</button>
    </header>

    <div class="sync-dashboard">
        <div class="stat-box"><small>Wellness</small><span id="cloud-wellness">--%</span></div>
        <div class="stat-box"><small>LTHR</small><span id="disp-lthr">--</span></div>
        <div class="stat-box"><small>Max HR</small><span id="disp-max">--</span></div>
        <div class="stat-box"><small>Rest HR</small><span id="disp-rest">--</span></div>
    </div>

    <div id="assistant-box">
        <div id="warn-msg" style="font-weight: 900; text-transform: uppercase; color: var(--secondary);">System gotowy</div>
        <div id="sugg-msg" style="color: #64748b; margin-top: 5px; font-size: 0.9rem;">Kliknij dzisiejszy trening, aby wysłać raport.</div>
    </div>

    <h3 style="margin-left: 10px;">Twój Plan (Kliknij, by zaraportować)</h3>
    <div id="dynamic-plan"></div>
</div>

<script>
    const CONFIG = {
        csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVLylCkxR1sbSnxYdWGCBpgeILRZMa3uTZCz6qPQ47Q5QJsinxI_T2n_KkjxKlbbz6JBadfQLLXxDP/pub?gid=950508224&single=true&output=csv"
    };

    const workoutLibrary = {
        run: [
            { day: 'Pon', title: 'Bieg spokojny + Przebieżki', desc: '40m Z2 + 6x20s żwawo.', type: 'filler' },
            { day: 'Wt', title: 'Interwały LTHR', desc: '3x10m @ Threshold HR.', type: 'priority' },
            { day: 'Śr', title: 'Regeneracja', desc: 'Wolne.', type: 'rest' },
            { day: 'Czw', title: 'Siła biegowa', desc: 'Podbiegi 10x150m.', type: 'priority' },
            { day: 'Pią', title: 'Bieg tlenowy', desc: '50m Z1/Z2.', type: 'filler' },
            { day: 'Sob', title: 'Long Run', desc: '90m tlenowo.', type: 'priority' },
            { day: 'Nie', title: 'Joga / Mobility', desc: '30m pracy nad zakresem.', type: 'rest' }
        ],
        bike: [
            { day: 'Pon', title: 'Base Ride', desc: '60m Z2.', type: 'filler' },
            { day: 'Wt', title: 'Sweet Spot', desc: '2x20m @ 90% LTHR.', type: 'priority' },
            { day: 'Śr', title: 'Wolne', desc: 'Odpoczynek.', type: 'rest' },
            { day: 'Czw', title: 'VO2 Max Boost', desc: '5x3m Max HR.', type: 'priority' },
            { day: 'Pią', title: 'Recovery Spin', desc: '40m lekko.', type: 'filler' },
            { day: 'Sob', title: 'Dłuższa jazda', desc: '120m w terenie.', type: 'priority' },
            { day: 'Nie', title: 'Mobilizacja', desc: 'Rolowanie.', type: 'rest' }
        ]
    };

    let currentPlan = [];
    let selectedWorkoutIndex = null;

    function saveOnboarding() {
        const profile = {
            sport: document.getElementById('user-sport').value,
            days: parseInt(document.getElementById('user-days').value),
            maxHR: document.getElementById('user-max-hr').value,
            lthr: document.getElementById('user-lthr').value,
            restHR: document.getElementById('user-rest-hr').value,
            stress: document.getElementById('user-life-stress').value
        };
        localStorage.setItem('acai_user_profile', JSON.stringify(profile));
        document.getElementById('onboarding-overlay').classList.add('hidden');
        initApp();
    }

    function initApp() {
        const p = JSON.parse(localStorage.getItem('acai_user_profile'));
        if(!p) {
            document.getElementById('onboarding-overlay').classList.remove('hidden');
            return;
        }
        
        document.getElementById('disp-max').innerText = p.maxHR;
        document.getElementById('disp-lthr').innerText = p.lthr;
        document.getElementById('disp-rest').innerText = p.restHR;
        
        buildPlan(p);
        sync();
    }

    function buildPlan(p) {
        let base = (p.sport === 'run') ? workoutLibrary.run : workoutLibrary.bike;
        currentPlan = JSON.parse(JSON.stringify(base));
        
        let activeDays = currentPlan.filter(t => t.type !== 'rest').length;
        
        // Redukcja dni jeśli budżet mniejszy niż baza
        for(let i=0; i<currentPlan.length; i++) {
            if(activeDays > p.days && currentPlan[i].type === 'filler') {
                currentPlan[i].title = "Odpoczynek (Limit czasu)";
                currentPlan[i].desc = "AI zwolniło ten dzień.";
                currentPlan[i].type = 'rest';
                activeDays--;
            }
        }
        renderPlan();
    }

    function renderPlan() {
        const container = document.getElementById('dynamic-plan');
        container.innerHTML = '';
        currentPlan.forEach((t, idx) => {
            const card = document.createElement('div');
            card.className = 'training-card';
            if(t.type === 'rest') card.style.opacity = '0.5';
            card.onclick = () => openPostWorkout(idx);
            card.innerHTML = `
                <span class="day-tag">${t.day}</span>
                <strong style="margin-left:10px">${t.title}</strong>
                <p style="font-size: 0.8rem; color: #64748b; margin: 8px 0 0 0;">${t.desc}</p>
            `;
            container.appendChild(card);
        });
    }

    function openPostWorkout(idx) {
        if(currentPlan[idx].type === 'rest') return;
        selectedWorkoutIndex = idx;
        document.getElementById('pw-title').innerText = currentPlan[idx].title;
        document.getElementById('post-workout-overlay').classList.remove('hidden');
    }

    function savePostWorkout() {
        const rpe = document.getElementById('pw-rpe').value;
        const pain = document.getElementById('pw-pain').value;
        
        // AI Reaction
        let feedback = `Zapisano RPE ${rpe}/10. `;
        if(rpe > 8) feedback += "Bardzo mocna sesja. AI sugeruje wydłużenie snu. ";
        if(pain !== 'no') feedback += "⚠️ Uwaga: Zgłoszono ból. Monitoruję sytuację.";
        
        document.getElementById('sugg-msg').innerText = feedback;
        closeModals();
        
        // Wizualne oznaczenie ukończenia
        const cards = document.getElementsByClassName('training-card');
        cards[selectedWorkoutIndex].style.borderLeft = "8px solid var(--strength)";
    }

    function closeModals() {
        document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
    }

    async function sync() {
        try {
            const r = await fetch(CONFIG.csvUrl + "&t=" + Date.now());
            const txt = await r.text();
            const rows = txt.split(/\r?\n/).map(l => l.split(","));
            rows.forEach(([p,v]) => {
                if(p === "Status_Zmeczenia") document.getElementById('cloud-wellness').innerText = v + "%";
            });
            document.getElementById('sync-status').innerText = "Sync: " + new Date().toLocaleTimeString();
        } catch(e) { console.warn("Working offline"); }
    }

    function resetAll() { localStorage.clear(); location.reload(); }

    window.onload = initApp;
</script>
</body>
</html>
