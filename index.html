<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro-Coach AI | Performance Dashboard</title>

<style>
:root{
--primary:#0f172a;
--secondary:#2563eb;
--accent:#dc2626;
--strength:#059669;
--recovery:#d97706;
--bg:#f8fafc;
--text-dark:#1e293b;
--card-border:#e2e8f0;
}
*{box-sizing:border-box;}
body{
font-family:system-ui,-apple-system,sans-serif;
background:var(--bg);
color:var(--text-dark);
margin:0;
padding:20px;
line-height:1.6;
}
.container{max-width:1100px;margin:0 auto;}
header{
background:var(--primary);
color:white;
padding:1.5rem;
border-radius:12px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:4px solid var(--secondary);
}
header h1{margin:0;font-size:1.2rem;}

.sync-dashboard{
background:#1e293b;
color:white;
padding:20px;
border-radius:12px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}
.stat-box{border-left:3px solid var(--secondary);padding-left:15px;}
.stat-box small{font-size:0.7rem;color:#94a3b8;text-transform:uppercase;font-weight:800;display:block;}
.stat-box span{font-size:1.4rem;font-weight:900;}

#assistant-box{
background:white;
border-left:10px solid #cbd5e1;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 4px 6px rgba(0,0,0,0.05);
}
#warn-msg{margin:0;font-size:1.1rem;font-weight:800;text-transform:uppercase;}
#sugg-msg{margin:8px 0 0 0;color:#475569;}

.card{
background:white;
padding:20px;
border-radius:12px;
border:1px solid var(--card-border);
margin-bottom:20px;
}
h2{
font-size:1rem;
border-left:4px solid var(--secondary);
padding-left:10px;
margin-top:0;
text-transform:uppercase;
}

canvas{
width:100%;
display:block;
}

@media(max-width:850px){
.grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>PRO-COACH AI 2026</h1>
<div id="sync-status">Oczekiwanie na dane...</div>
</header>

<div class="sync-dashboard">
<div class="stat-box"><small>Wellness</small><span id="cloud-wellness">--%</span></div>
<div class="stat-box"><small>TSS (7d)</small><span id="cloud-tss">---</span></div>
<div class="stat-box"><small>Waga</small><span id="cloud-weight">-- kg</span></div>
<div class="stat-box"><small>Moc relatywna</small><span id="wkg">--</span> W/kg</div>
</div>

<div id="assistant-box">
<div id="warn-msg">Inicjalizacja...</div>
<div id="sugg-msg">Łączenie z arkuszem.</div>
</div>

<div class="card">
<h2>Trend TSS (30 dni)</h2>
<canvas id="tssChart" height="120"></canvas>
</div>

<div class="card">
<h2>Trend FTP / Masa (W/kg)</h2>
<canvas id="ftpChart" height="120"></canvas>
</div>

</div>

<script>
/* ==============================
   CONFIG
============================== */

const CONFIG = {
csvUrl: "TWÓJ_LINK_CSV",
refreshInterval: 60000,
cacheKey: "procoach_cache_v2",
timeout: 8000
};

let isSyncing = false;

/* ==============================
   UTILS
============================== */

function safeNumber(v){
const n=parseFloat(v);
return isNaN(n)?null:n;
}

function parseCSV(text){
return text.trim().split(/\r?\n/).map(r=>r.split(",").map(c=>c.trim()));
}

function saveCache(data){
localStorage.setItem(CONFIG.cacheKey,JSON.stringify(data));
}

function loadCache(){
const raw=localStorage.getItem(CONFIG.cacheKey);
return raw?JSON.parse(raw):null;
}

function updateHistory(history,value,maxDays=30){
const today=new Date().toISOString().split("T")[0];
history[today]=value;
const keys=Object.keys(history).sort();
while(keys.length>maxDays){
delete history[keys.shift()];
}
return history;
}

function fetchWithTimeout(url,timeout){
return Promise.race([
fetch(url),
new Promise((_,reject)=>setTimeout(()=>reject(new Error("Timeout")),timeout))
]);
}

/* ==============================
   SYNC
============================== */

async function syncSheets(){
if(isSyncing)return;
isSyncing=true;

const warn=document.getElementById("warn-msg");
const sugg=document.getElementById("sugg-msg");
const status=document.getElementById("sync-status");

try{

const response=await fetchWithTimeout(CONFIG.csvUrl+"&cache="+Date.now(),CONFIG.timeout);
if(!response.ok)throw new Error();

const text=await response.text();
const rows=parseCSV(text);

let weight=null,ftp=null,tss=null;

rows.forEach(([p,v])=>{
switch(p){
case "Waga":weight=safeNumber(v);break;
case "FTP":ftp=safeNumber(v);break;
case "TSS":tss=safeNumber(v);break;
case "Status_Zmeczenia":updateWellness(v);break;
case "Rekomendacja":sugg.innerText=v;break;
}
});

const cache=loadCache()||{tssHistory:{},wkgHistory:{}};

if(tss)cache.tssHistory=updateHistory(cache.tssHistory,tss);
if(weight&&ftp&&weight>0){
const wkg=(ftp/weight).toFixed(2);
document.getElementById("wkg").innerText=wkg;
cache.wkgHistory=updateHistory(cache.wkgHistory,parseFloat(wkg));
}else{
document.getElementById("wkg").innerText="--";
}

if(weight)document.getElementById("cloud-weight").innerText=weight+" kg";
if(tss)document.getElementById("cloud-tss").innerText=tss;

saveCache(cache);
renderCharts(cache);

warn.style.color="var(--strength)";
warn.innerText="SYSTEM ZSYNCHRONIZOWANY";
status.innerText="Ostatnia aktualizacja: "+new Date().toLocaleTimeString();

}catch(e){

warn.style.color="var(--accent)";
warn.innerText="BŁĄD POŁĄCZENIA (tryb offline)";
const cache=loadCache();
if(cache)renderCharts(cache);

}

isSyncing=false;
}

/* ==============================
   WELLNESS
============================== */

function updateWellness(score){
const s=parseInt(score);
if(isNaN(s))return;

const box=document.getElementById("assistant-box");
const cloud=document.getElementById("cloud-wellness");

cloud.innerText=s+"%";

let color="var(--strength)";
let msg="GOTOWY NA TRENING";

if(s<40){color="var(--accent)";msg="REGENERACJA WYMAGANA";}
else if(s<70){color="var(--recovery)";msg="ZACHOWAJ OSTROŻNOŚĆ";}

box.style.borderLeft="10px solid "+color;
document.getElementById("warn-msg").style.color=color;
document.getElementById("warn-msg").innerText=msg;
}

/* ==============================
   CHART ENGINE
============================== */

function drawLineChart(id,data,color){
const canvas=document.getElementById(id);
if(!canvas)return;
const ctx=canvas.getContext("2d");
const width=canvas.width=canvas.offsetWidth;
const height=canvas.height;
ctx.clearRect(0,0,width,height);

const values=Object.values(data);
if(values.length<2)return;

const max=Math.max(...values);
const min=Math.min(...values);
const pad=20;

ctx.beginPath();
ctx.strokeStyle=color;
ctx.lineWidth=2;

values.forEach((v,i)=>{
const x=pad+(i/(values.length-1))*(width-pad*2);
const y=height-pad-((v-min)/(max-min||1))*(height-pad*2);
if(i===0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);
});

ctx.stroke();
}

function renderCharts(cache){
drawLineChart("tssChart",cache.tssHistory,"#dc2626");
drawLineChart("ftpChart",cache.wkgHistory,"#059669");
}

/* ==============================
   INIT
============================== */

window.onload=()=>{
const cache=loadCache();
if(cache)renderCharts(cache);
syncSheets();

setInterval(()=>{
if(document.visibilityState==="visible"){
syncSheets();
}
},CONFIG.refreshInterval);
};
</script>

</body>
</html>
